[mypy]
python_version = 3.12
follow_imports = normal
ignore_missing_imports = True
allow_untyped_globals = False
# TODO(kdmccormick): ccx_keys (merged in from edx-ccx-keys) is not type-checked. Checking it
# requires adding a py.typed marker, which would also advertise it as typed to consumers.
packages = opaque_keys
